# Tiny mixture-of-experts test model (version 3 of the harness): tiny_dense plus MoE layers.
# Layer 1 stays dense (first_k_dense_layers in config v0); layers 2 to 4 have 16 routed experts, 2 chosen per
# token, plus 1 shared expert, with the balancing and routing settings of config v0 (S14).
inherits: tiny_dense.yaml

moe:
  num_experts: 16                  # source: tiny test size (harness; a scaled-down S14 shape)
  num_experts_per_tok: 2           # source: tiny test size (harness)
  moe_intermediate_size: 128       # source: tiny test size (harness; equals hidden_size)
  bias_update_rate: 0.01           # source: harness measurement 25 Oct (100 steps: at 0.001 one expert takes 5x its share, at 0.01 the load settles at 0.4x-1.9x); 0.001 (S14) stays for long runs
