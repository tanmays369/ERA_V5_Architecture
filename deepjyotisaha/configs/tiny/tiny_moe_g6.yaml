# A larger small config for G6 (Performance) to time: still minutes on one GPU, with more experts and longer
# sequences so the MoE dispatch and attention take a visible share of the step.
inherits: tiny_moe.yaml

model:
  num_hidden_layers: 6             # source: small test size for G6 timing (harness)
  hidden_size: 256                 # source: small test size for G6 timing (harness)
  num_attention_heads: 8           # source: small test size for G6 timing (harness)
  num_key_value_heads: 2           # source: small test size for G6 timing (harness)
  head_dim: 32                     # source: small test size for G6 timing (harness)
  intermediate_size: 768           # source: small test size for G6 timing (harness)
  max_position_embeddings: 256     # source: small test size for G6 timing (harness)

moe:
  num_experts: 32                  # source: small test size for G6 timing (harness)
  num_experts_per_tok: 4           # source: small test size for G6 timing (harness)
  moe_intermediate_size: 256       # source: small test size for G6 timing (harness)

training:
  global_batch_tokens: 8192        # source: small test size for G6 timing (harness; 32 windows of 256 tokens)
  sequence_length: 256             # source: small test size for G6 timing (harness)

harness:
  micro_batch_size: 16             # source: harness
