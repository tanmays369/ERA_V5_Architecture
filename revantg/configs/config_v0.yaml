# Name: Revant Gupta
# Pack: ind-hi-fw2
# Team 5 harness v0 config. Every leaf line carries its source; null sizes are open_keys (TSAI fills 31 Oct).
# Check: python harness/check_config.py configs/config_v0.yaml
general:
  project: era-v5-arch                 # team 5 (Architecture) label, dir teams/05-architecture
  run: null                            # optional label; train.py --out names the run
  seed: 1234                           # G5 brief 24 Oct
  deterministic: true                  # G5 brief 24 Oct: two seed-1234 runs byte-identical per-step loss
tokenizer:
  name: theschoolofai/BrahmicTokenizer-131K    # S7 §13 + Admin G6 answer 25 Oct
  revision: 7dfcf398172c825c6689ad578e8b484ca5f57bc9    # pinned commit, Admin G6 answer 25 Oct (worklog 26 Oct)
  url: https://raw.githubusercontent.com/theschoolofai/BrahmicTokenizer-131K/7dfcf398172c825c6689ad578e8b484ca5f57bc9/tokenizer.json    # S7 §13 + Admin G6 answer 25 Oct
  sha256: 01d968a7970b029c071b29f060abf6104b66168dedf2ff3b1a0290a545739fff    # measured on pinned file (worklog 26 Oct)
  vocab_size: 131072                   # S9 (init loss ln 131072 = 11.78)
  eos_id: 36                           # <|end_of_text|> in tokenizer.json (worklog 26 Oct)
embedding:
  type: kronecker                      # S7 §13 + kronecker-embeddings README/code + arXiv 2605.29459
  char_dim: 256                        # S7 §13 + kronecker-embeddings README/code + arXiv 2605.29459
  pos_dim: 32                          # S7 §13 + kronecker-embeddings README/code + arXiv 2605.29459
  mode: dynamic                        # S7 §13 + kronecker-embeddings README/code + arXiv 2605.29459
  projection_trainable: true           # S7 §13 + kronecker-embeddings README/code + arXiv 2605.29459
  weight_decay: 0.0                    # S15 §18 (no WD on embeddings); kronecker-embeddings code: projection is the only param
  ke2_output_shape: null               # G4 sends KE2 output shape Tue 27 Oct (lead, G5 26 Oct)
model:
  n_layers: null                       # open: TSAI 31 Oct
  d_model: null                        # open: TSAI 31 Oct
  n_heads: null                        # open: TSAI 31 Oct
  n_kv_heads: null                     # open: TSAI 31 Oct
  d_ff: null                           # open: TSAI 31 Oct
  ffn: swiglu                          # S9 §2
  norm: rmsnorm                        # S9 §2
  norm_position: pre                   # S9 §2
  norm_eps: 1.0e-6                     # SmolLM3 stage1_8T.yaml
  position: rope                       # S8 §8; absolute table ruled out S8 §16
  rope_theta: 50000                    # SmolLM3 stage1_8T.yaml
  qk_norm: true                        # S15 §18
  bias: false                          # SmolLM3 stage1_8T.yaml
  dropout: 0.0                         # S10 §15
  tie_embeddings: false                # S7 §13 (untied)
  init_std: 0.02                       # SmolLM3 stage1_8T.yaml
  norm_gain_init: 1.0                  # S15 transcript L56
moe:
  enabled: true                        # G5 brief 24 Oct + lead 26 Oct: tiny MoE
  num_experts: null                    # open: TSAI 31 Oct (S14 §20)
  top_k: null                          # open: TSAI 31 Oct (S14 §20)
  shared_experts: 0                    # S14 §20 (DeepSeek-style shared expert optional)
  router_dtype: fp32                   # S14 §20
  balancing: aux_free_bias             # S14 §20
  bias_update_speed: 1.0e-3            # S14 §20
  seq_aux_loss_coef: 1.0e-4            # S14 §20
  dropless: true                       # S14 §20
head:
  loss: cross_entropy                  # S9 (init loss ln V)
  z_loss_coef: 1.0e-4                  # S15 L213 (z-loss S15 §18)
  mtp_heads: 0                         # off: v0 harness has no MTP head (contract)
optimizer:
  matrices_2d: muon                    # Admin G6 answer 25 Oct + S11 §13
  other_params: adamw                  # Admin G6 answer 25 Oct + S11 §13
  lr: 3.0e-4                           # S11 §2
  adam_betas: [0.9, 0.999]             # S11 §4-6
  adam_eps: 1.0e-8                     # S11 §4-6
  weight_decay: 0.1                    # SmolLM3; LR*WD law 17.04/steps (S16 §12) to test wk2
  muon_momentum: 0.95                  # torch.optim.Muon default (Keller Jordan reference)
  muon_nesterov: true                  # torch.optim.Muon default (Keller Jordan reference)
  muon_ns_steps: 5                     # torch.optim.Muon default (Keller Jordan reference)
  muon_ns_dtype: fp32                  # T4 has no bf16
  muon_adjust_lr: match_rms_adamw      # torch Muon option; lets Muon share AdamW lr
  no_decay: [norm, bias, embedding]    # S15 §18 (no WD on embeddings); norm/bias per Admin G6 split
  grad_clip: 1.0                       # S15 §18
  activation_grad_clip: false          # off in v0 (contract); not wired in harness
schedule:
  type: wsd                            # S11 §10/§14
  warmup_frac: 0.02                    # S11 §10/§14; long warmup S15 §18
  decay_frac: 0.10                     # S11 §10/§14
  min_lr_ratio: 0.0                    # S11 §10/§14 (WSD decays to 0)
tokens:
  seq_len: null                        # open: TSAI 31 Oct
  global_batch_seqs: null              # open: TSAI 31 Oct
  micro_batch_seqs: null               # open: TSAI 31 Oct
  train_steps: null                    # open: TSAI 31 Oct
precision: fp32                        # T4 has no bf16; S10 §16 precision open
parallelism:
  dp: 1                                # nanotron ParallelismArgs; layouts in configs/small
  tp: 1                                # nanotron ParallelismArgs; layouts in configs/small
  pp: 1                                # nanotron ParallelismArgs; layouts in configs/small
  pp_engine: 1f1b                      # nanotron ParallelismArgs
  pp_microbatches: 4                   # nanotron ParallelismArgs
  tp_mode: all_reduce                  # nanotron ParallelismArgs
  zero_stage: 0                        # nanotron ParallelismArgs
  recompute_layer: false               # nanotron ParallelismArgs
  expert_parallel_size: 1              # nanotron ParallelismArgs
  context_parallel_size: 1             # nanotron ParallelismArgs
datasets:
  - {name: fineweb_edu, hf: HuggingFaceFW/fineweb-edu, subset: sample-10BT, split: train, text_field: text}    # SmolLM3 stage1_8T.yaml sources
  - {name: dclm, hf: mlfoundations/dclm-baseline-1.0, subset: null, split: train, text_field: text}    # SmolLM3 stage1_8T.yaml sources
  - {name: finemath, hf: HuggingFaceTB/finemath, subset: finemath-3plus, split: train, text_field: text}    # SmolLM3 stage1_8T.yaml sources
  - {name: code, hf: codeparrot/codeparrot-clean, subset: null, split: train, text_field: content}    # code: codeparrot Python-only, the-stack-smol needs HF token
  - {name: hin, hf: HuggingFaceFW/fineweb-2, subset: hin_Deva, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: ben, hf: HuggingFaceFW/fineweb-2, subset: ben_Beng, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: tam, hf: HuggingFaceFW/fineweb-2, subset: tam_Taml, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: tel, hf: HuggingFaceFW/fineweb-2, subset: tel_Telu, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: kan, hf: HuggingFaceFW/fineweb-2, subset: kan_Knda, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: mal, hf: HuggingFaceFW/fineweb-2, subset: mal_Mlym, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: mar, hf: HuggingFaceFW/fineweb-2, subset: mar_Deva, split: train, text_field: text}    # FineWeb-2 Indic subset
  - {name: guj, hf: HuggingFaceFW/fineweb-2, subset: guj_Gujr, split: train, text_field: text}    # FineWeb-2 Indic subset
data:
  docs_per_source: null                # open: TSAI 31 Oct (harness size)
  heldout_docs_per_source: null        # open: TSAI 31 Oct (harness size)
data_stages:
  - name: stable                       # SmolLM3 stage names
    start_frac: 0.0                    # SmolLM3 8T/9T/11T boundaries
    weights: {fineweb_edu: 0.22, dclm: 0.18, code: 0.22, finemath: 0.08, hin: 0.10, ben: 0.04, tam: 0.03, tel: 0.03, kan: 0.03, mal: 0.025, mar: 0.025, guj: 0.02}    # hypothesis per S5 ("a proportion is an opinion until a proxy run has tested it"); code rising, programming = goal #1 (S15 §19)
  - name: stage2                       # SmolLM3 stage names
    start_frac: 0.73                   # SmolLM3 8T/9T/11T boundaries (8/11)
    weights: {fineweb_edu: 0.19, dclm: 0.15, code: 0.26, finemath: 0.12, hin: 0.09, ben: 0.04, tam: 0.03, tel: 0.03, kan: 0.03, mal: 0.02, mar: 0.02, guj: 0.02}    # hypothesis per S5; code rising (S15 §19)
  - name: anneal                       # SmolLM3 stage names
    start_frac: 0.82                   # SmolLM3 8T/9T/11T boundaries (9/11)
    weights: {fineweb_edu: 0.20, dclm: 0.10, code: 0.28, finemath: 0.14, hin: 0.09, ben: 0.04, tam: 0.03, tel: 0.03, kan: 0.03, mal: 0.02, mar: 0.02, guj: 0.02}    # hypothesis per S5; code rising (S15 §19)
safety:
  on_nan: stop                         # S15 L363-365
  checkpoint_after_nan: false          # S15 L363-365
  spike_sigma: 7                       # S15 L363-365
  spike_window: 1000                   # S15 L363-365
  ema_alpha: 0.97                      # S15 L363-365
  ema_z_threshold: 2.5                 # S15 L363-365
freeze:
  frozen_parts: []                     # S15 §18
  hash_frozen_weights: true            # S15 §18
logging:
  format: jsonl                        # G8 gate: "rows equal JSONL lines"
  scalars_every: 1                     # S15 L693-701
  per_layer_every: 10                  # S15 L693-701
  eval_every: null                     # open: TSAI 31 Oct
  metrics: [loss, loss_ntp, loss_mtp, lr, tokens_per_second, gpu_alloc_gb, z_loss, held_out_loss, bpb, grad_norm, update_to_weight_ratio, max_attn_logit, spike_score, ema_z, step_time_ms, dead_experts, top_expert_share]    # first 6: lead G5 26 Oct (V4 dashboard list, G8 hand-off); rest S15 L693-701, L739
checkpoint:
  every_steps: 100                     # interval open S15 §18; harness default
  strict_load: true                    # S15 L633
  keep_last: 2                         # interval open S15 §18; harness default
paths:
  tokenizer: work/tokenizer/tokenizer.json    # contract env rules (scratch under work/, relative to cwd)
  data: work/data/default              # contract env rules (scratch under work/)
  runs: work/runs                      # contract env rules (scratch under work/)
open_keys: [model.n_layers, model.d_model, model.n_heads, model.n_kv_heads, model.d_ff, moe.num_experts, moe.top_k, tokens.seq_len, tokens.global_batch_seqs, tokens.micro_batch_seqs, tokens.train_steps, data.docs_per_source, data.heldout_docs_per_source, logging.eval_every, embedding.ke2_output_shape]    # sizes TSAI fills 31 Oct (contract); ke2 shape from G4
