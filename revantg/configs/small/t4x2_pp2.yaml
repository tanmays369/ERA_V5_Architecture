# R3: pipeline parallel on 2xT4; one micro-batch of 16 split into 4 pipeline micro-batches.
extends: t4_base.yaml                 # parent config, deep-merged (contract small configs)
parallelism:
  pp: 2                                # R3 PP over 2xT4 (contract run matrix)
  pp_microbatches: 4                   # nanotron ParallelismArgs; 16/4 = 4 seqs per pipeline micro-batch
tokens:
  micro_batch_seqs: 16                 # PP needs grad_accum 1: global 16 = 1 x 16 (contract)
