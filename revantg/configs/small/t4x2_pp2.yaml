# R3: pipeline parallel on 2xT4; one micro-batch of 16 split into 4 pipeline micro-batches.
extends: t4_base.yaml                 # [ours] parent config, deep-merged (contract small configs)
parallelism:
  pp: 2                                # [ours] R3 PP over 2xT4 (contract run matrix)
  pp_microbatches: 4                   # [ours] torch.distributed.pipelining n_microbatches; 16/4 = 4 seqs per pipeline micro-batch
tokens:
  micro_batch_seqs: 16                 # [ours] PP needs grad_accum 1: global 16 = 1 x 16 (contract)
