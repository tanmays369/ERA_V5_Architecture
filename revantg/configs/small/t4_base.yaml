# Name: Revant Gupta
# Pack: ind-hi-fw2
# Harness-size base for Kaggle T4 runs; layouts extend this.
extends: ../config_v0.yaml            # parent config, deep-merged (contract small configs)
model:
  n_layers: 4                          # harness size, T4 fits
  d_model: 256                         # harness size, T4 fits
  n_heads: 4                           # harness size, T4 fits
  n_kv_heads: 2                        # harness size, T4 fits
  d_ff: 768                            # harness size, T4 fits
moe:
  enabled: false                       # dense reference arm (lead 26 Oct: MoE vs dense)
tokens:
  seq_len: 256                         # harness size, T4 fits
  global_batch_seqs: 16                # harness size, T4 fits
  micro_batch_seqs: 4                  # harness size, T4 fits
  train_steps: 300                     # harness size, T4 fits
data:
  docs_per_source: 500                 # harness size, T4 fits
  heldout_docs_per_source: 20          # harness size, T4 fits
logging:
  eval_every: 50                       # harness size, T4 fits
checkpoint:
  every_steps: 100                     # harness size, T4 fits
paths:
  data: work/data/t4                   # harness data dir under work/ (contract env rules)
